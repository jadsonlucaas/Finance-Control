name: whatsapp-api image

on:
  push:
    branches:
      - main
    paths:
      - 'services/whatsapp-api/**'
      - 'src/core/**'
      - 'src/domain/**'
      - 'src/application/selectors/**'
      - '.github/workflows/whatsapp-api-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: whatsapp-api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/finance-control-whatsapp-api" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/whatsapp-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
